androidx-viewmodel = "2.0.0"
calendarview = "2.0.1"
crashlytics = "2.9.9"
dagger = "2.57.2"
datepicker = "4.1.0"
expandablelayout = "2.9.2"
firebase-core = "16.0.7"
glide = "4.9.0"
google-gson = "2.8.5"
google-location = "16.0.0"
google-material = "1.1.0-alpha06"
google-services = "4.0.1"
jackson = "2.9.7"
kotlin = "2.1.20"
rx-android = "2.1.0"
rx-binding = "3.0.0-alpha2"

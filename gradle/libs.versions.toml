[versions]
android-gradle-plugin = "8.13.1"
compose-bom = "2026.05.00"
androidx-activity = "1.12.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.0.2"
kotlin = "2.3.20"
square-okhttp-new = "4.12.0"
square-retrofit-new = "2.12.0"
timber = "4.7.1"

koin-bom = "4.2.1"
kotlinx-serialization-json = "1.11.0"
kotlinx-coroutines = "1.11.0"
nav3-core = "1.0.0"
lifecycle-viewmodel-nav3 = "2.10.0-rc01"
lifecycle-runtime-compose = "2.10.0"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Compose (via BOM)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-activity = { group = "androidx.activity", name = "activity-compose" }

# Koin (via BOM)
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }

# Kotlinx Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# Kotlinx Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Navigation 3
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3-core" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3-core" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle-viewmodel-nav3" }

# Retrofit — upgraded + kotlinx-serialization converter
retrofit-new = { module = "com.squareup.retrofit2:retrofit", version.ref = "square-retrofit-new" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "square-retrofit-new" }

# OkHttp — upgraded
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "square-okhttp-new" }
okhttp-logging-interceptor-new = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "square-okhttp-new" }

# Lifecycle
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-runtime-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-runtime-compose" }

[bundles]
compose = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3", "compose-material-icons-core"]
koin = ["koin-core", "koin-android", "koin-compose", "koin-compose-viewmodel"]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
navigation3 = ["navigation3-runtime", "navigation3-ui"]

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
